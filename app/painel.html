<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manutenção</title>
<link rel="stylesheet" href="estilo.css?v=0.26.3">
<link rel="stylesheet" href="painel.css?v=0.26.3">
<link rel="stylesheet" href="controles-atendimento.css?v=0.26.3">
</head>
<body>
<svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden"><symbol id="i-chev-d" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"></path></symbol><symbol id="i-chev-u" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"></path></symbol><symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5L20 7"></path></symbol><symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.5-4M4 4v4h4"></path><path d="M4 13a8 8 0 0 0 14.5 4M20 20v-4h-4"></path></symbol><symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V6a2 2 0 0 1 2-2h9"></path></symbol><symbol id="i-flag" viewBox="0 0 24 24"><path d="M6 21V4M6 5h11l-2 4 2 4H6"></path></symbol><symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"></path></symbol><symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 3 5 14h6l-1 7 8-11h-6z"></path></symbol><symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 3c1 4 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 .3 1.5 1 2 2 2-.5-3 0-5 1-8z"></path></symbol><symbol id="i-brick" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1"></rect><path d="M3 10h18M3 15h18M9 5v5M15 10v5M9 15v4"></path></symbol><symbol id="i-door" viewBox="0 0 24 24"><path d="M6 21V4h12v17M4 21h16"></path><circle cx="15" cy="13" r=".8"></circle></symbol><symbol id="i-brush" viewBox="0 0 24 24"><rect x="4" y="4" width="14" height="6" rx="1"></rect><path d="M18 7h2v5h-8v3"></path><rect x="10" y="15" width="4" height="6" rx="1"></rect></symbol><symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="12" r="4"></circle><path d="M12 12h9M18 12v3M15 12v2"></path></symbol><symbol id="i-wrench" viewBox="0 0 24 24"><path d="M14.5 6.5a4 4 0 0 0-5 5L4 17l3 3 5.5-5.5a4 4 0 0 0 5-5l-2.5 2.5-2.5-.5-.5-2.5z"></path></symbol></svg>
<main class="gi-cockpit panel" id="gi-cockpit" aria-label="Manutenção do imóvel">
  <header class="pc" id="cp-cabecalho">
    <div class="pc__row"><h1 class="pc__name" id="cp-nome">Contato do atendimento</h1><button type="button" class="btn btn--ghost btn--icon" id="cp-atualizar" aria-label="Atualizar consulta" title="Atualizar consulta"><svg class="i"><use href="#i-refresh"></use></svg></button></div>
    <div class="pc__doc" id="cp-contexto"></div>
    <p class="pc__sum" id="cp-resumo-linha"><span id="cp-resumo"></span> · <em id="cp-idade" aria-live="polite"></em></p>
    <div id="cp-selecao" class="pc__sel" hidden><select id="cp-imovel" aria-label="Imóvel locado"></select><svg class="i"><use href="#i-chev-d"></use></svg></div>
    <button type="button" class="pc__link" id="cp-outra-pessoa" hidden>Não é esta pessoa?</button>
    <div class="foot" id="cp-vendo-como" hidden></div>
    <div id="cp-pessoa-escolha" hidden></div>
  </header>
  <div id="cp-recado" class="gi-recado" role="status" aria-live="polite" hidden></div>
  <p class="panel__note" id="cp-escrita-aviso" hidden>Abertura e edição de chamados pelo cockpit estão desligadas nesta instalação.</p>
  <nav class="tabs" role="tablist" aria-label="Dados de manutenção" hidden id="cp-abas">
    <button type="button" role="tab" id="cp-tab-chamados" aria-controls="cp-conteudo" aria-selected="true" data-aba="chamados">Chamados (0)</button>
    <button type="button" role="tab" id="cp-tab-imovel" aria-controls="cp-conteudo" aria-selected="false" data-aba="imovel" tabindex="-1">Imóvel</button>
    <button type="button" role="tab" id="cp-tab-novo" aria-controls="cp-conteudo" aria-selected="false" data-aba="novo" tabindex="-1">Novo</button>
  </nav>
  <section id="cp-conteudo" class="panel__content" role="tabpanel" aria-labelledby="cp-tab-chamados" aria-live="polite" aria-busy="true"><p class="gi-cartao state">Carregando…</p></section>

  <div id="cp-residencia-acoes" hidden><button type="button" class="btn" id="cp-vincular-residencia" hidden>Vincular outra residência</button><p class="foot" id="cp-residencia-aviso" hidden></p></div>
  <footer class="panel__note" id="gi-modo"></footer>
  <div id="gi-erro" role="alert" hidden></div>
</main>
<script src="comum.js?v=0.26.3"></script>
<script src="manutencao.js?v=0.26.3"></script>
<script src="cockpit.js?v=0.26.3"></script>
<script src="painel.js?v=0.26.3"></script>
</body>
</html>
