<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chamados de manutenção</title>
<link rel="stylesheet" href="estilo.css?v=0.23.0">
<link rel="stylesheet" href="chamados.css?v=0.23.0">
<link rel="stylesheet" href="os.css?v=0.23.0">
</head>
<body>
<main class="gi-conteudo" id="gi-os">
  <div class="gi-topo"><h1>Chamados de manutenção</h1><button class="btn" type="button" id="b-fechar">Fechar</button></div>
  <div class="gi-erro" id="gi-erro" role="alert"></div>
  <div class="gi-aviso" id="gi-sem-portal" hidden>Manutenção exige o portal conectado. Configure a conexão e abra a tela novamente.</div>
  <p id="os-recado" role="status" aria-live="polite"></p>
  <section id="os-listagem">
    <div class="gi-barra"><button class="btn btn-primario" id="b-novo" type="button" disabled>Novo chamado</button><button class="btn" id="b-atualizar" type="button" disabled>Atualizar</button></div>
    <div id="os-lista" aria-live="polite"></div>
  </section>
  <section id="os-edicao" hidden><button class="btn" id="b-voltar" type="button">Voltar à lista</button><div id="os-form"></div></section>
  <p class="gi-nota" id="gi-modo">verificando conexão…</p>
</main>
<script src="comum.js?v=0.23.0"></script>
<script src="manutencao.js?v=0.23.0"></script>
<script src="fotos.js?v=0.23.0"></script>
<script src="chamado-form.js?v=0.23.0"></script>
<script src="os.js?v=0.23.0"></script>
</body>
</html>
