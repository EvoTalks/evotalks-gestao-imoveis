<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chamados de manutenção</title>
<link rel="stylesheet" href="estilo.css?v=0.25.2">
<link rel="stylesheet" href="chamados.css?v=0.25.2">
</head>
<body class="gi">
<main class="gi-conteudo" id="gi-manutencao">
  <div class="gi-topo"><div><h1>Chamados de manutenção</h1><p class="gi-sub" id="gi-resumo" aria-live="polite">carregando chamados…</p></div><div id="gi-nav"></div></div>
  <div class="gi-erro" id="gi-erro" role="alert"></div>
  <div class="gi-aviso" id="gi-sem-portal" hidden>Manutenção exige o portal conectado. Configure a conexão e abra a tela novamente.</div>
  <section id="gi-lista">
    <div class="gi-barra">
      <div class="gi-campo gi-flex"><label for="f-busca">Buscar por O.S., chamado, imóvel ou cliente</label><input id="f-busca" type="search" placeholder="ex.: 1042, vazamento, Ed. Jasmim, Carla"></div>
      <div class="gi-campo"><label for="f-status">Status</label><select id="f-status"><option value="">todos</option></select></div>
      <div class="gi-campo"><label for="f-prioridade">Prioridade</label><select id="f-prioridade"><option value="">todas</option></select></div>
      <div class="gi-campo"><label for="f-porpagina">Por página</label><select id="f-porpagina"><option>25</option><option>50</option><option>100</option></select></div>
      <button class="btn btn-primario" id="b-buscar" type="button">Buscar</button><button class="btn" id="b-limpar" type="button">Limpar</button>
    </div>
    <div class="gi-barra gi-barra-acoes"><span class="gi-mudo gi-pequeno">Ordenados do mais novo para o mais antigo.</span><button class="btn btn-primario" id="b-novo" type="button">Novo chamado</button></div>
    <div class="gi-tabela-rolagem"><table><thead><tr><th style="width:92px">O.S.</th><th>Chamado</th><th style="width:205px">Imóvel</th><th style="width:150px">Atendimento</th><th style="width:110px">Prioridade</th><th style="width:140px">Prazo</th><th style="width:150px">Prestador</th><th style="width:140px">Status</th><th style="width:100px" class="gi-direita">Funções</th></tr></thead><tbody id="gi-corpo" aria-live="polite"><tr><td colspan="9">carregando…</td></tr></tbody></table></div>
    <div class="gi-rodape"><button class="btn btn-slim" id="b-anterior" type="button">← anterior</button><span class="gi-pagina-atual" id="gi-pagina">1</span><button class="btn btn-slim" id="b-proxima" type="button">próxima →</button><span class="gi-pequeno gi-mudo" id="gi-total"></span></div>
  </section>
  <p class="gi-nota"><span id="gi-modo">verificando conexão…</span></p>
</main>
<script src="comum.js?v=0.25.2"></script>
<script src="manutencao.js?v=0.25.2"></script>
<script src="fotos.js?v=0.25.2"></script>
<script src="chamado-form.js?v=0.25.2"></script>
<script src="chamados.js?v=0.25.2"></script>
</body>
</html>
