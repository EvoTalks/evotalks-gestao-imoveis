<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imóveis</title>
<link rel="stylesheet" href="estilo.css?v=0.31.0">
<link rel="stylesheet" href="chamados.css?v=0.31.0">
<link rel="stylesheet" href="visualizacao.css?v=0.31.0">
</head>
<body class="gi gi-gestao gi-permissoes-pendentes">

<div class="gi-topo">
  <div>
    <h1>Imóveis</h1>
    <p class="gi-sub" id="gi-resumo">carregando o catálogo…</p>
  </div>
  <div id="gi-nav"></div>
</div>

<div class="gi-erro" id="gi-erro"></div>

<!-- ------------------------------------------------------------------ lista -->
<section id="gi-lista">
  <div class="gi-barra gi-filtros-imoveis">
    <div class="gi-campo" style="flex:1 1 240px">
      <label for="f-termo">Buscar por código, título ou bairro</label>
      <input id="f-termo" type="search" placeholder="ex.: 0060, apartamento, Souza Cruz">
    </div>
    <div class="gi-campo">
      <label for="f-finalidade">Finalidade</label>
      <select id="f-finalidade">
        <option value="">todas</option><option value="locacao">Locação</option><option value="venda">Venda</option>
      </select>
    </div>
    <div class="gi-campo">
      <label for="f-situacao">Situação</label>
      <select id="f-situacao">
        <option value="">todas</option><option value="disponivel">Disponível</option><option value="reservado">Reservado</option><option value="indisponivel">Indisponível</option>
      </select>
    </div>
    <div class="gi-campo">
      <label for="f-estado">Estado</label>
      <select id="f-estado">
        <option value="">todos</option>
        <option value="pendente">Pendentes</option>
        <option value="preenchido">Verificados</option>
      </select>
    </div>
    <div class="gi-campo">
      <label for="f-porpagina">Por página</label>
      <select id="f-porpagina">
        <option>25</option><option>50</option><option>100</option>
      </select>
    </div>
    <button class="btn btn-primario" id="b-buscar" type="button">Buscar</button>
    <button class="btn" id="b-limpar" type="button">Limpar</button>
  </div>

  <div class="gi-tabela-rolagem">
    <table>
      <thead>
        <tr>
          <th style="width:88px">Capa</th>
          <th style="width:92px">Código</th>
          <th>Imóvel</th>
          <th style="width:140px">Bairro</th>
          <th style="width:115px" class="gi-direita">Valor</th>
          <th style="width:105px">Preenchido</th>
          <th style="width:115px">Status</th>
          <th style="width:190px">Situação</th>
          <th style="width:150px" class="gi-direita">Funções</th>
        </tr>
      </thead>
      <tbody id="gi-corpo">
        <tr><td colspan="9" class="gi-mudo">carregando…</td></tr>
      </tbody>
    </table>
  </div>

  <div class="gi-rodape">
    <button class="btn btn-slim" id="b-anterior" type="button">&larr; anterior</button>
    <span class="gi-pagina-atual" id="gi-pagina">1</span>
    <button class="btn btn-slim" id="b-proxima" type="button">próxima &rarr;</button>
    <span class="gi-pequeno gi-mudo" id="gi-origem" style="margin-left:auto"></span>
  </div>
</section>

<p class="gi-nota">
  <span id="gi-modo">verificando onde os dados são gravados…</span>
</p>

<div class="gi-aviso" id="gi-situacao-aviso" hidden></div>
<script src="comum.js?v=0.31.0"></script>
<script src="visualizacao.js?v=0.31.0"></script>
<script>
(function () {
  'use strict';

  var estado = {
    pagina: 1, porPagina: 25, termo: '', finalidade: '', filtroEstado: '', filtroSituacao: '',
    itens: [], campos: [], valores: {}, preenchidos: {}, situacoes: null, gravando: Object.create(null)
  };
  var geracao = 0;
  var capas = Object.create(null), listaVisivel = [];

  var el = function (id) { return document.getElementById(id); };

  /* Ícones em SVG, não em fonte de ícone: dentro do contêiner da extensão a
     fonte `icon-far-*` da instância não é carregada. */
  var ICONE_ABRIR = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
  var ICONE_EXCLUIR = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>';

  /* O estado vem com o nome junto, como os chips de tipo da plataforma. */
  function selo(codigo) {
    var ok = quantosPreenchidos(codigo) > 0;
    return '<span class="gi-estado ' + (ok ? 'gi-estado-ok' : 'gi-estado-pendente') + '">' +
      '<span class="gi-ponto ' + (ok ? 'gi-ponto-ok' : 'gi-ponto-pendente') + '"></span>' +
      (ok ? 'Verificado' : 'Pendente') + '</span>';
  }
  function quantosPreenchidos(codigo) {
    if (estado.valores[codigo]) return Object.keys(estado.valores[codigo]).length;
    return Number(estado.preenchidos[codigo] || 0);
  }
  function anotarPreenchidos(codigo, quantos) {
    if (quantos) estado.preenchidos[codigo] = quantos;
    else delete estado.preenchidos[codigo];
  }

  /* ------------------------------------------------------------------ lista */

  function situacaoDoImovel(codigo) {
    return estado.situacoes && Object.prototype.hasOwnProperty.call(estado.situacoes, codigo) ? estado.situacoes[codigo] : 'disponivel';
  }

  function desenharLista() {
    var corpo = el('gi-corpo');
    var linhas = estado.itens;

    if (estado.filtroEstado === 'pendente') {
      linhas = linhas.filter(function (p) { return quantosPreenchidos(p.internalcode) === 0; });
    } else if (estado.filtroEstado === 'preenchido') {
      linhas = linhas.filter(function (p) { return quantosPreenchidos(p.internalcode) > 0; });
    }
    if (estado.filtroSituacao && estado.situacoes) {
      linhas = linhas.filter(function (p) { return situacaoDoImovel(p.internalcode) === estado.filtroSituacao; });
    }

    listaVisivel = linhas.slice();
    if (!linhas.length) {
      corpo.innerHTML = '<tr><td colspan="9"><div class="gi-vazio">' +
        'Nenhum imóvel nesta página com esses filtros.<br>' +
        '<span class="gi-pequeno">Alargue um filtro por vez — não invente resultado para o cliente.</span>' +
        '</div></td></tr>';
      GI.ajustarAltura();
      return;
    }

    corpo.innerHTML = linhas.map(function (p) {
      var cat = GI.partesCategoria(p.category);
      var n = quantosPreenchidos(p.internalcode);
      var codigo = GI.escapar(p.internalcode);
      var situacao = '<span class="gi-mudo">—</span>';
      if (estado.situacoes) {
        var valor = estado.gravando[p.internalcode] || situacaoDoImovel(p.internalcode);
        var atual = GI.SITUACOES.filter(function (s) { return s.valor === valor; })[0];
        situacao = '<select class="gi-estado ' + atual.classe + '" data-situacao="' + codigo +
          '"' + (estado.gravando[p.internalcode] ? ' disabled' : '') + ' aria-label="Situação de ' + GI.escapar(GI.codigoCurto(p.internalcode)) + '">' +
          GI.SITUACOES.map(function (s) {
            return '<option value="' + s.valor + '"' + (s.valor === valor ? ' selected' : '') + '>' + s.rotulo + '</option>';
          }).join('') + '</select>';
        if (!GI.pode('ver_imoveis')) situacao = '<span class="gi-estado ' + atual.classe + '">' + GI.escapar(atual.rotulo) + '</span>';
      }
      var urlCapa = capas[p.internalcode];
      var miniatura = '<span class="gi-capa-vazia" aria-hidden="true">⌂</span>';
      if (typeof urlCapa === 'string' && /^https?:\/\//i.test(urlCapa)) miniatura += '<img src="' + GI.escapar(urlCapa) + '" alt="' + GI.escapar(p.name) + '" loading="lazy">';
      return '<tr>' +
        '<td><button type="button" class="gi-capa" data-detalhe="' + codigo + '" aria-label="' + GI.escapar(p.name) + '">' + miniatura + '</button></td>' +
        '<td class="gi-nowrap"><button type="button" class="gi-imovel-link" data-detalhe="' + codigo + '"><strong>' + GI.escapar(GI.codigoCurto(p.internalcode)) + '</strong></button>' +
          '<div class="gi-ajuda">' + GI.escapar(p.internalcode) + '</div></td>' +
        '<td><button type="button" class="gi-imovel-link" data-detalhe="' + codigo + '">' + GI.escapar(p.name) + '</button><div class="gi-ajuda">' + GI.escapar(cat.tipo) + (GI.finalidadeDoImovel(p) ? ' · ' + GI.escapar(GI.finalidadeDoImovel(p) === 'locacao' ? 'Locação' : 'Venda') : '') + '</div></td>' +
        '<td>' + GI.escapar(cat.bairro || cat.cidade) + '</td>' +
        '<td class="gi-direita gi-nowrap">' + GI.dinheiro(p.value) + '</td>' +
        '<td>' + (n ? '<span class="gi-chip">' + n + ' campo' + (n > 1 ? 's' : '') + '</span>' : '<span class="gi-mudo gi-pequeno">nada ainda</span>') + '</td>' +
        '<td>' + selo(p.internalcode) + '</td>' +
        '<td>' + situacao + '</td>' +
        '<td>' +
          '<div class="gi-acoes">' + (GI.pode('editar_imoveis') ?
            '<button type="button" class="btn btn-slim btn-icone" title="Editar" aria-label="Editar" ' +
              'data-abrir="' + codigo + '">' + ICONE_ABRIR + '</button>' +
            '<button type="button" class="btn btn-slim btn-icone btn-perigo" ' +
              'title="' + (n ? 'Excluir as informações preenchidas' : 'Nada preenchido para excluir') + '" ' +
              'aria-label="Excluir as informações preenchidas" ' +
              (n ? '' : 'disabled ') + 'data-excluir="' + codigo + '">' + ICONE_EXCLUIR + '</button>'
           : '') + '</div>' +
        '</td>' +
      '</tr>';
    }).join('');

    Array.prototype.forEach.call(corpo.querySelectorAll('.gi-capa img'), function (img) {
      img.addEventListener('error', function () { img.remove(); });
    });
    Array.prototype.forEach.call(corpo.querySelectorAll('[data-detalhe]'), function (b) {
      b.addEventListener('click', function () { abrirDetalhe(b.getAttribute('data-detalhe')); });
    });
    Array.prototype.forEach.call(corpo.querySelectorAll('[data-abrir]'), function (b) {
      b.addEventListener('click', function () { abrirImovel(b.getAttribute('data-abrir')); });
    });
    Array.prototype.forEach.call(corpo.querySelectorAll('[data-excluir]'), function (b) {
      b.addEventListener('click', function () { excluirImovel(b.getAttribute('data-excluir')); });
    });
    Array.prototype.forEach.call(corpo.querySelectorAll('[data-situacao]'), function (seletor) {
      seletor.addEventListener('change', function () {
        var codigo = seletor.getAttribute('data-situacao');
        if (estado.gravando[codigo]) return;
        var proxima = seletor.value;
        estado.gravando[codigo] = proxima;
        seletor.disabled = true;
        GI.salvarSituacao(codigo, proxima).then(function () {
          Object.defineProperty(estado.situacoes, codigo, { value: proxima, enumerable: true, configurable: true, writable: true });
          GI.aviso('Situação atualizada.', 'success');
        }).catch(function (err) {
          GI.aviso(GI.mensagemErro(err), 'error');
        }).then(function () {
          delete estado.gravando[codigo];
          desenharLista();
        });
      });
    });
    GI.ajustarAltura();
  }

  /* Excluir aqui é apagar as informações adicionais lançadas no imóvel — o
     imóvel em si vem do catálogo do Imogestão e não se apaga por esta tela.
     Some da resposta da IA, então pede confirmação e vai para o histórico. */
  function excluirImovel(codigo) {
    if (!GI.pode('editar_imoveis')) return;
    var quantos = quantosPreenchidos(codigo);
    if (!quantos) return;

    GI.confirmar({
      titulo: 'Excluir informações do imóvel',
      mensagem: 'Apagar ' + quantos + ' campo' + (quantos > 1 ? 's' : '') + ' preenchido' +
        (quantos > 1 ? 's' : '') + ' do imóvel ' + GI.codigoCurto(codigo) + '?',
      detalhe: 'A assistente de IA deixa de responder essas informações ao cliente. O histórico guarda o que foi removido.',
      rotuloOk: 'Excluir', perigo: true
    }).then(function (ok) {
      if (!ok) return null;
      return GI.valoresDoImovel(codigo).then(function (lancados) {
        var porId = {};
        estado.campos.forEach(function (c) { porId[c.id] = c; });
        var eventos = Object.keys(lancados).map(function (id) {
          return { codigo: codigo, campo: porId[id] ? porId[id].nome : id,
                   acao: 'removeu', de: GI.valorLegivel(porId[id], lancados[id]), para: '' };
        });
        return GI.apagarValoresDoImovel(codigo, estado.campos)
          .then(function () { return eventos.length ? GI.registrarHistorico(eventos) : null; })
          .then(function () {
            estado.valores[codigo] = {};
            anotarPreenchidos(codigo, 0);
            GI.aviso('Informações do imóvel ' + GI.codigoCurto(codigo) + ' excluídas.', 'success');
            desenharLista();
          });
      });
    }).catch(GI.erroFatal);
  }

  function carregar() {
    var atual = ++geracao;
    el('gi-corpo').innerHTML = '<tr><td colspan="9" class="gi-mudo">buscando…</td></tr>';
    return GI.buscarImoveis({
      termo: estado.termo, finalidade: estado.finalidade, pagina: estado.pagina, porPagina: estado.porPagina
    }).then(function (r) {
      if (atual !== geracao) return;
      estado.itens = r.itens;
      el('gi-pagina').textContent = String(estado.pagina);
      // Uma página incompleta prova o total, mesmo quando o SDK não o informa.
      var totalConhecido = r.total !== null ? r.total : r.itens.length < estado.porPagina ?
        (estado.pagina - 1) * estado.porPagina + r.itens.length : null;
      el('gi-origem').innerHTML = r.itens.length + ' nesta página' +
        (totalConhecido !== null ? ' · <span class="gi-total-catalogo">' + GI.escapar(totalConhecido) + '</span> no total' : '');
      el('gi-origem').title = r.ms + ' ms · ' + GI.estrategiaCatalogo;
      el('b-anterior').disabled = estado.pagina <= 1;
      el('b-proxima').disabled = r.itens.length < estado.porPagina;
      desenharLista();
      var faltantes = r.itens.map(function (p) { return p.internalcode; }).filter(function (codigo, i, lista) { return !Object.prototype.hasOwnProperty.call(capas, codigo) && lista.indexOf(codigo) === i; });
      faltantes.forEach(function (codigo) { capas[codigo] = null; });
      if (!faltantes.length) return;
      return GI.capasImoveis(faltantes).catch(function () { return {}; }).then(function (mapa) {
        faltantes.forEach(function (codigo) { capas[codigo] = mapa[codigo] || null; });
        if (atual === geracao) desenharLista();
      });
    });
  }

  function carregarSituacoes() {
    estado.situacoes = null;
    el('f-situacao').disabled = true;
    if (GI.modo !== 'portal') {
      el('gi-situacao-aviso').hidden = false;
      el('gi-situacao-aviso').textContent = 'Situação exige o portal conectado.';
      return Promise.resolve();
    }
    return GI.situacoesMapa().then(function (mapa) {
      if (!mapa || typeof mapa !== 'object' || Array.isArray(mapa) || Object.keys(mapa).some(function (codigo) {
        return !GI.SITUACOES.some(function (s) { return s.valor === mapa[codigo]; });
      })) throw new Error('Mapa de situações inválido');
      estado.situacoes = mapa; el('f-situacao').disabled = false;
      el('gi-situacao-aviso').hidden = true;
    }).catch(function (err) {
      el('gi-situacao-aviso').hidden = false;
      el('gi-situacao-aviso').textContent = 'Situação indisponível: ' + GI.mensagemErro(err) + '. Reabra a tela para tentar novamente.';
    });
  }

  /* Visualização: uma consulta por código, inclusive durante carga. */
  var detalhes = Object.create(null), detalheAberto = false;

  function abrirDetalhe(codigo) {
    if (detalheAberto) return;
    detalheAberto = true;
    GI.visualizarImovel({
      codigo: codigo, estado: estado, situacao: situacaoDoImovel,
      lista: function () { return listaVisivel.slice(); },
      carregar: function (id) {
        if (!detalhes[id]) detalhes[id] = GI.detalheDoImovel(id).catch(function () { return null; });
        return detalhes[id];
      },
      atualizar: desenharLista,
      editar: abrirImovel
    }).then(function () { detalheAberto = false; });
  }

  /* ------------------------------------------------------ edição num modal */

  function abrirImovel(codigo) {
    if (!GI.pode('editar_imoveis')) return;
    var imovel = null;

    GI.buscarImovel(codigo).then(function (p) {
      imovel = p;
      return GI.valoresDoImovel(codigo);
    }).then(function (lancados) {
      estado.valores[codigo] = lancados;
      var cat = GI.partesCategoria(imovel.category);
      var valorSituacaoInicial = estado.situacoes ? situacaoDoImovel(codigo) : null;
      var situacaoInicial = GI.SITUACOES.filter(function (s) { return s.valor === valorSituacaoInicial; })[0];
      var campoSituacao = '<div class="gi-campo-caixa" style="margin-top:16px" id="gi-editar-situacao">' +
        '<label for="gi-situacao-editar">Situação</label>' +
        (situacaoInicial ? (GI.pode('ver_imoveis') ?
          '<select id="gi-situacao-editar" data-situacao-editar class="gi-estado ' + situacaoInicial.classe + '">' +
            GI.SITUACOES.map(function (s) { return '<option value="' + s.valor + '"' + (s.valor === valorSituacaoInicial ? ' selected' : '') + '>' + GI.escapar(s.rotulo) + '</option>'; }).join('') +
          '</select>' : '<span data-situacao-editar-selo class="gi-estado ' + situacaoInicial.classe + '">' + GI.escapar(situacaoInicial.rotulo) + '</span>') :
          '<span class="gi-mudo">—</span>') +
        '</div>';

      var corpo =
        '<div class="gi-modal-imovel">' +
          '<div class="gi-modal-imovel-titulo">' + GI.escapar(imovel.name) + '</div>' +
          '<div class="gi-ajuda">' +
            GI.escapar(GI.codigoCurto(imovel.internalcode)) + ' · ' + GI.escapar(cat.tipo) +
            (cat.bairro ? ' · ' + GI.escapar(cat.bairro) : '') +
            (cat.cidade ? ' · ' + GI.escapar(cat.cidade) : '') +
            ' · ' + GI.dinheiro(imovel.value) +
            ' · código interno ' + GI.escapar(imovel.internalcode) +
          '</div>' +
        '</div>' +
        campoSituacao +
        '<div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:16px 0 8px">' +
          '<strong style="font-size:13.5px">Informações adicionais</strong>' +
          '<span class="gi-ajuda">não aparecem no site — vão só para quem atende</span>' +
        '</div>' +
        '<div class="gi-grade-campos" id="gi-form-campos"></div>';

      var fecharModal = null;
      return GI.modal({
        titulo: 'Editar imóvel ' + GI.codigoCurto(codigo),
        corpo: corpo,
        rotuloOk: 'Atualizar',
        aoAbrir: function () {
          desenharFormulario(codigo);
          var situacao = document.querySelector('[data-situacao-editar]');
          if (situacao) situacao.addEventListener('change', atualizarSituacaoEdicao);
        },
        aoControlar: function (fechar) { fecharModal = fechar; },
        aoFechar: function (caixa) {
          if (!formularioAlterado(codigo, valorSituacaoInicial)) return true;
          var descarte = caixa.querySelector('[data-descartar-edicao]');
          if (!descarte) {
            descarte = document.createElement('div');
            descarte.setAttribute('data-descartar-edicao', '');
            descarte.className = 'gi-confirmacao';
            descarte.innerHTML = '<p>Descartar as alterações?</p><button type="button" class="btn btn-perigo" data-descartar-sim>Descartar</button> <button type="button" class="btn" data-descartar-nao>Continuar editando</button>';
            caixa.appendChild(descarte);
            descarte.querySelector('[data-descartar-sim]').addEventListener('click', function () { if (fecharModal) fecharModal(true); });
            descarte.querySelector('[data-descartar-nao]').addEventListener('click', function () { descarte.parentNode.removeChild(descarte); });
          }
          descarte.hidden = false;
          return false;
        },
        aoConfirmar: function () { return salvar(codigo); }
      });
    }).then(function () {
      desenharLista();
    }).catch(GI.erroFatal);
  }

  function formularioAlterado(codigo, situacaoInicial) {
    var situacao = document.querySelector('[data-situacao-editar]');
    if (situacao && situacao.value !== situacaoInicial) return true;
    var novo = lerFormulario();
    if (novo['@erro']) return true;
    var antigo = estado.valores[codigo] || {};
    return Object.keys(novo).some(function (id) {
      return id !== '@erro' && GI.valorLegivel(estado.campos.filter(function (c) { return c.id === Number(id) || String(c.id) === id; })[0], novo[id]) !==
        GI.valorLegivel(estado.campos.filter(function (c) { return c.id === Number(id) || String(c.id) === id; })[0], antigo[id] || {});
    }) || Object.keys(antigo).some(function (id) { return !novo[id]; });
  }

  function atualizarSituacaoEdicao() {
    var seletor = document.querySelector('[data-situacao-editar]');
    if (!seletor) return;
    var atual = GI.SITUACOES.filter(function (s) { return s.valor === seletor.value; })[0];
    seletor.className = 'gi-estado ' + atual.classe;
  }

  function desenharFormulario(codigo) {
    var ativos = estado.campos.filter(function (c) { return c.ativo !== false; });
    var caixa = el('gi-form-campos');
    if (!caixa) return;

    if (!ativos.length) {
      caixa.innerHTML = '<div class="gi-vazio">Nenhum campo cadastrado ainda.<br>' +
        '<span class="gi-pequeno">Crie os campos na tela <strong>Campos</strong> — eles valem para todos os imóveis.</span></div>';
      return;
    }

    var lancados = estado.valores[codigo] || {};

    caixa.innerHTML = ativos.map(function (c) {
      var l = lancados[c.id] || {};
      var entrada;

      if (c.tipo === 'selecao') {
        entrada = '<select data-campo="' + c.id + '"><option value=""></option>' +
          (c.opcoes || []).map(function (o) {
            return '<option' + (String(l.valor) === o ? ' selected' : '') + '>' + GI.escapar(o) + '</option>';
          }).join('') + '</select>';
      } else if (c.tipo === 'simnao') {
        entrada = '<select data-campo="' + c.id + '">' +
          '<option value=""></option>' +
          '<option value="sim"' + (String(l.valor) === 'sim' ? ' selected' : '') + '>sim</option>' +
          '<option value="nao"' + (String(l.valor) === 'nao' ? ' selected' : '') + '>não</option>' +
          '</select>';
      } else {
        var v = (l.valor === undefined || l.valor === null) ? '' :
          (c.tipo === 'valor' || c.tipo === 'numero') ? String(l.valor).replace('.', ',') : l.valor;
        entrada = '<input data-campo="' + c.id + '" type="text" value="' + GI.escapar(v) + '"' +
          (c.tipo === 'valor' ? ' inputmode="decimal" placeholder="125,00"' : '') +
          (c.tipo === 'numero' ? ' inputmode="decimal" placeholder="2"' : '') + '>';
      }

      var recorrencia = (c.tipo === 'valor')
        ? '<div class="gi-campo-caixa"><label>Recorrência</label><select data-recorrencia="' + c.id + '">' +
            GI.RECORRENCIAS.map(function (r) {
              var sel = (l.recorrencia || c.recorrenciaPadrao || 'unico') === r.id ? ' selected' : '';
              return '<option value="' + r.id + '"' + sel + '>' + r.nome + '</option>';
            }).join('') + '</select></div>'
        : '<div></div>';

      return '<div class="gi-linha-campo">' +
        '<div><div class="gi-rotulo-campo">' + GI.escapar(c.nome) + '</div>' +
          '<div class="gi-ajuda">' + GI.escapar(GI.nomeTipo(c.tipo)) + '</div>' +
          '<div class="gi-previa" data-previa="' + c.id + '"></div></div>' +
        '<div class="gi-campo-caixa"><label>Valor</label>' + entrada + '</div>' +
        recorrencia +
        '<div class="gi-campo-caixa"><label>Observação</label>' +
          '<input data-obs="' + c.id + '" type="text" value="' + GI.escapar(l.obs || '') + '" placeholder="opcional"></div>' +
      '</div>';
    }).join('');

    Array.prototype.forEach.call(caixa.querySelectorAll('[data-campo],[data-obs],[data-recorrencia]'), function (i) {
      i.addEventListener('input', atualizarPrevias);
      i.addEventListener('change', atualizarPrevias);
    });
    atualizarPrevias();
  }

  function lerFormulario() {
    var saida = {};
    estado.campos.forEach(function (c) {
      if (c.ativo === false) return;
      var entrada = document.querySelector('[data-campo="' + c.id + '"]');
      if (!entrada) return;
      var obsNo = document.querySelector('[data-obs="' + c.id + '"]');
      var recNo = document.querySelector('[data-recorrencia="' + c.id + '"]');
      var bruto = String(entrada.value || '').trim();
      var obs = obsNo ? String(obsNo.value || '').trim() : '';

      if (bruto === '' && obs === '') return;                 // vazio dos dois lados = não existe

      var valor = bruto;
      if ((c.tipo === 'valor' || c.tipo === 'numero') && bruto !== '') {
        if (!GI.numeroValido(bruto)) { saida['@erro'] = c.nome; return; }
        valor = GI.paraNumero(bruto);
      }
      saida[c.id] = { valor: valor, obs: obs };
      if (c.tipo === 'valor' && recNo) saida[c.id].recorrencia = recNo.value;
    });
    return saida;
  }

  function atualizarPrevias() {
    var lido = lerFormulario();
    estado.campos.forEach(function (c) {
      var alvo = document.querySelector('[data-previa="' + c.id + '"]');
      if (!alvo) return;
      alvo.textContent = lido[c.id] ? GI.valorLegivel(c, lido[c.id]) : '';
    });
    GI.ajustarAltura();
  }

  /* Devolve promise: o modal só fecha quando a gravação volta, e uma recusa
     (número inválido, portal fora) mantém a tela aberta com o que foi digitado. */
  function salvar(codigo) {
    if (!GI.pode('editar_imoveis')) return Promise.reject(new Error('Você não tem permissão para editar imóveis.'));
    var novo = lerFormulario();

    if (novo['@erro']) {
      throw new Error('O campo "' + novo['@erro'] + '" não é um número válido — nada foi gravado.');
    }
    var antigo = estado.valores[codigo] || {};
    var seletorSituacao = document.querySelector('[data-situacao-editar]');
    var situacaoNova = seletorSituacao ? seletorSituacao.value : null;
    var situacaoAntiga = estado.situacoes ? situacaoDoImovel(codigo) : null;
    if (situacaoNova !== null && situacaoNova !== situacaoAntiga && !GI.pode('ver_imoveis')) {
      return Promise.reject(new Error('Você não tem permissão para mudar a situação.'));
    }
    var eventos = [];
    var porId = {};
    estado.campos.forEach(function (c) { porId[c.id] = c; });

    Object.keys(novo).forEach(function (id) {
      var de = antigo[id] ? GI.valorLegivel(porId[id], antigo[id]) : '';
      var para = GI.valorLegivel(porId[id], novo[id]);
      if (de !== para) {
        eventos.push({ codigo: codigo, campo: porId[id] ? porId[id].nome : id,
                       acao: de ? 'alterou' : 'preencheu', de: de, para: para });
      }
    });
    Object.keys(antigo).forEach(function (id) {
      if (!novo[id]) {
        eventos.push({ codigo: codigo, campo: porId[id] ? porId[id].nome : id,
                       acao: 'removeu', de: GI.valorLegivel(porId[id], antigo[id]), para: '' });
      }
    });

    var situacaoMudou = situacaoNova !== null && situacaoNova !== situacaoAntiga;
    if (!eventos.length && !situacaoMudou) {
      GI.aviso('Nada mudou — nenhuma linha gravada.', 'info');
      return Promise.resolve(true);
    }

    var gravarValores = eventos.length ? GI.salvarValoresDoImovel(codigo, novo, estado.campos)
      .then(function () { return GI.registrarHistorico(eventos); }) : Promise.resolve();
    return gravarValores.then(function () {
      if (!situacaoMudou) return;
      return GI.salvarSituacao(codigo, situacaoNova).then(function () {
        Object.defineProperty(estado.situacoes, codigo, { value: situacaoNova, enumerable: true, configurable: true, writable: true });
        desenharLista();
      });
    })
      .then(function () {
        if (Object.keys(novo).length) estado.valores[codigo] = novo;
        else delete estado.valores[codigo];
        anotarPreenchidos(codigo, Object.keys(novo).length);
        GI.aviso((eventos.length ? eventos.length + (eventos.length > 1 ? ' alterações gravadas' : ' alteração gravada') : 'Situação atualizada') +
          ' no imóvel ' + GI.codigoCurto(codigo) + '.', 'success');
        return true;
      });
  }

  /* ------------------------------------------------------------------ ligar */

  GI.pronto(function () {
    el('gi-nav').innerHTML = GI.cabecalho('gi-imoveis');
    GI.ligarNavegacao();
    if (!GI.exigirPermissao('ver_imoveis')) return;
    if (GI.modo === 'portal') el('gi-modo').parentNode.hidden = true;

    el('b-buscar').addEventListener('click', function () {
      estado.termo = el('f-termo').value.trim();
      estado.finalidade = el('f-finalidade').value;
      estado.pagina = 1;
      carregar().catch(GI.erroFatal);
    });
    el('f-termo').addEventListener('keydown', function (e) { if (e.key === 'Enter') el('b-buscar').click(); });
    el('f-finalidade').addEventListener('change', function () {
      estado.finalidade = el('f-finalidade').value; estado.pagina = 1;
      carregar().catch(GI.erroFatal);
    });
    el('b-limpar').addEventListener('click', function () {
      el('f-termo').value = ''; el('f-finalidade').value = ''; el('f-estado').value = ''; el('f-situacao').value = '';
      estado.termo = ''; estado.finalidade = ''; estado.filtroEstado = ''; estado.filtroSituacao = ''; estado.pagina = 1;
      carregar().catch(GI.erroFatal);
    });
    el('f-estado').addEventListener('change', function () {
      estado.filtroEstado = el('f-estado').value; desenharLista();
    });
    el('f-situacao').addEventListener('change', function () {
      estado.filtroSituacao = el('f-situacao').value; desenharLista();
    });
    el('f-porpagina').addEventListener('change', function () {
      estado.porPagina = Number(el('f-porpagina').value); estado.pagina = 1;
      carregar().catch(GI.erroFatal);
    });
    el('b-anterior').addEventListener('click', function () {
      if (estado.pagina > 1) { estado.pagina--; carregar().catch(GI.erroFatal); }
    });
    el('b-proxima').addEventListener('click', function () {
      estado.pagina++; carregar().catch(GI.erroFatal);
    });

    return Promise.all([
      GI.campos(), GI.valores(), GI.preenchidos(), carregarSituacoes()
    ]).then(function (r) {
      estado.campos = r[0];
      estado.valores = r[1];
      estado.preenchidos = r[2];
      var ativos = estado.campos.filter(function (c) { return c.ativo !== false; }).length;
      var comInfo = Object.keys(estado.preenchidos).length;
      el('gi-resumo').innerHTML = '<span class="gi-contagem-campos">' + ativos + '</span> campo' + (ativos === 1 ? '' : 's') + ' em uso · ' +
        comInfo + ' imóve' + (comInfo === 1 ? 'l' : 'is') + ' com informação preenchida';
      return carregar();
    });
  });
})();
</script>
